name: CI

# Validates every push and pull request. Deploys are handled by Vercel's
# Git integration (frontend) and Render/Railway's Git integration
# (backend + ML), so no deploy secrets live in GitHub Actions.

on:
  push:
    branches: [main, navin]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------- Backend API tests -----------------------------
  backend-tests:
    name: Backend API (Jest + Supertest)
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      MONGODB_URI: mongodb://localhost:27017/pos-db-ci
      TEST_MONGODB_URI: mongodb://localhost:27017/pos-db-test
      JWT_SECRET: ci_test_secret
      RAZORPAY_KEY_SECRET: ci_test_razorpay_secret
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        working-directory: Restaurant_POS_System/pos-backend
        run: npm ci || npm install

      - name: Install test dependencies
        working-directory: tests/backend
        run: npm ci || npm install

      - name: Run API tests
        working-directory: tests/backend
        run: npx jest --runInBand --forceExit

  # ------------------------------- ML service tests ----------------------------
  ml-tests:
    name: ML Service (pytest)
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      MONGODB_URI: mongodb://localhost:27017/pos-db-mltest
      TEST_MONGODB_URI: mongodb://localhost:27017/pos-db-mltest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ML dependencies
        working-directory: Restaurant_POS_ML
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run ML tests
        run: python -m pytest tests/ml -v

  # ----------------------- Frontend lint + production build --------------------
  frontend-build:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: Restaurant_POS_System/pos-frontend
        run: npm ci || npm install

      - name: Lint
        working-directory: Restaurant_POS_System/pos-frontend
        run: npm run lint --if-present
        continue-on-error: true

      - name: Production build
        working-directory: Restaurant_POS_System/pos-frontend
        run: npm run build
